---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Walid Amriou Website">
    <meta name="author" content="walidamriou">
    <title>WALID NOTES</title>
    <link rel="icon" href="{{ '/assets/img/icon/favicon.ico' | relative_url }}" sizes="any">
    <style>
        html, body {
            background-color: #f5f5f5;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            font-family: monospace;
            opacity: 0.9;
            line-height: 1.6;
        }

        a {
            color: #000;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #4b9f75;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        footer {
            padding: 4%;
            background-color: #000; 
            color: #fff;
            text-align: center;
        }

        header {
            padding: 4%;
            text-align: center;
            margin-bottom: 5%;
            margin-top: 5%;
        }

        .language-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .language-buttons a {
            color: #fff;
            background-color: #980000;
            border-radius: 20px;
            padding: 10px 15px;
            border: .1rem solid #000;
            font-size: 20px;
            margin: 5px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .language-buttons a.disabled {
            background-color: #969696;
            pointer-events: none;
            cursor: default;
        }

        section {
            text-align: center;
            padding: 1%;
        }

        /* Responsive styles for buttons */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            header h3 {
                font-size: 1.1rem;
            }
            .language-buttons {
                gap: 8px;
                margin: 15px 0;
            }
            .language-buttons a {
                padding: 8px 12px;
                font-size: 16px;
                margin: 3px;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.8rem;
            }
            header h3 {
                font-size: 1rem;
            }
            .language-buttons {
                flex-direction: column;
                align-items: center;
                gap: 5px;
                margin: 10px 0;
            }
            .language-buttons a {
                padding: 6px 10px;
                font-size: 14px;
                margin: 2px;
                width: 80%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
            <h1 style="font-size: 2.5rem; font-weight: 700;">WALID NOTES</h1>
            <h3 style="font-size: 1.3rem; font-weight: 400;">The personal blog of Walid A.</h3>
            <br>
            <div class="language-buttons">
                <a href="{{ '/en/' | relative_url }}" role="link">English</a>
                <a href="{{ '/de/' | relative_url }}" role="link" class="disabled">Deutsch</a>
                <a href="{{ '/fr/' | relative_url }}" role="link" class="disabled">Français</a>
                <a href="{{ '/ar/' | relative_url }}" role="link" class="disabled">العربية</a>
            </div>
    </header>
    <main>

    </main>

    <footer>
        <p>The Personal Blog of Walid A. © {{ site.time | date: '%Y' }}</p>
    </footer>
</body>
</html>
